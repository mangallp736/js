    <script>
        const nums = [1, 2, 3, 4];

        const result = nums.map((num) => {
            return num * num;
        });
        console.log(result);

        /////task2  even numbe using filter

        const number = [1, 2, 3, 4, 5, 6];

        const even = number.filter((allEven) => {
            return allEven % 2 === 0;
        });
        console.log("Even Numbers: ", even);

        ////odd number 

        const numbers = [1,2,3,4,5,6];
        const odd = numbers.filter((oddNumber) => {
            return oddNumber % 2 !== 0;
        });
        console.log("Odd Numbers: ", odd);

        //////task3 total sum

        const numb = [1,2,3,4];

        const sum = numb.reduce((acc, curr) => {
            return acc + curr;
        }, 0);

        console.log(sum);
