<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map();</title>
  </head>
  <body>
    <h1>
      <strong>Map()</strong>A JavaScript Map is an object that can store
      collection of key-value pairs, similar to a dictionary in other
      programming language. <br />
      Map Differ from standered objects in that
      <strong>keys can be of any data type.</strong>
    </h1>
    <p>Press f12 show result</p>

    <!-- <p id="demo"></p> -->

    <div>
      <figure>
        <pre>
            // Create a new Map
            const fruits = new Map();

            // Set Map Values
            fruits.set("apples", 500);
            fruits.set("bananas", 300);
            fruits.set("oranges", 200);

            let numb = fruits.get("apples");
            console.log("Apples: ", numb);
            </pre
        >
      </figure>
    </div>
  </body>
</html>

<script>
  const fruits = new Map();
  fruits.set("Apples", 500);
  fruits.set("Bananas", 300);
  fruits.set("Oranges", 200);

  let numb = fruits.get("Apples");

  console.log("Apples: ", numb);
</script>
