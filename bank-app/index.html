<!doctype html>
<html>
  <head>
    <title>Bank App</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      input {
        padding: 8px;
        margin: 5px;
      }

      button {
        padding: 8px 12px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
      }

      .green {
        background: green;
      }
      .red {
        background: red;
      }
      .blue {
        background: blue;
      }
      .orange {
        background: orange;
      }

      .hidden {
        display: none;
      }

      li {
        margin: 5px 0;
      }
    </style>
  </head>

  <body>
    <h1>🏦 Bank App</h1>

    <!-- LOGIN -->
    <div id="login">
      <input id="name" placeholder="Name" />
      <input id="pin" type="password" placeholder="PIN" />
      <button class="blue" onclick="login()">Login</button>
    </div>

    <!-- APP -->
    <div id="app" class="hidden">
      <h2 id="welcome"></h2>

      <input id="amount" type="number" placeholder="Enter amount" />

      <br />

      <button class="green" onclick="deposit()">Deposit</button>
      <button class="red" onclick="withdraw()">Withdraw</button>
      <button class="orange" onclick="getBalance()">Balance</button>
      <button class="blue" onclick="getHistory()">History</button>
      <button onclick="logout()">Logout</button>

      <h3 id="output"></h3>

      <ul id="historyList"></ul>
    </div>

    <script>
      const API = "http://localhost:5000/api";
      let currentUser = null;

      // LOGIN
      async function login() {
        const name = document.getElementById("name").value;
        const pin = document.getElementById("pin").value;

        const res = await fetch(API + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, pin }),
        });

        const data = await res.json();

        currentUser = data.user;

        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

        document.getElementById("welcome").innerText =
          "Welcome " + currentUser.name;
      }

      // DEPOSIT
      async function deposit() {
        const amount = Number(document.getElementById("amount").value);

        const res = await fetch(API + "/deposit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: currentUser._id,
            amount,
          }),
        });

        currentUser = await res.json();
        document.getElementById("output").innerText = "Deposited ₹" + amount;
      }

      // WITHDRAW
      async function withdraw() {
        const amount = Number(document.getElementById("amount").value);

        const res = await fetch(API + "/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: currentUser._id,
            amount,
          }),
        });

        const data = await res.json();

        if (data.msg) {
          document.getElementById("output").innerText = data.msg;
        } else {
          currentUser = data;
          document.getElementById("output").innerText = "Withdrawn ₹" + amount;
        }
      }

      // BALANCE
      async function getBalance() {
        const res = await fetch(API + "/user/" + currentUser._id);
        const data = await res.json();

        document.getElementById("output").innerText =
          "Balance: ₹" + data.balance;
      }

      // HISTORY
      async function getHistory() {
        const res = await fetch(API + "/user/" + currentUser._id);
        const data = await res.json();

        const ul = document.getElementById("historyList");

        if (data.history.length === 0) {
          ul.innerHTML = "<li>No transactions</li>";
          return;
        }

        ul.innerHTML = data.history
          .map((item) => {
            const color = item.type === "Credit" ? "green" : "red";

            return `
      <li style="color:${color}">
        ${item.type} ₹${item.amount} <br>
        <small>${new Date(item.time).toLocaleString()}</small>
      </li>
    `;
          })
          .join("");
      }

      // LOGOUT
      function logout() {
        currentUser = null;
        document.getElementById("app").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
      }
    </script>
  </body>
</html>
