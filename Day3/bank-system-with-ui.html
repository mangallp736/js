<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank System</title>
    <link rel="stylesheet" href="../bootstrap-3/css/bootstrap.min.css" />

    <script src="../bootstrap-3/js/jquery.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Bank System</h2>
      <form>
        <div class="form-group">
          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            class=""
          />
        </div>
        <div class="form-group">
          <button type="button" class="btn btn-success" onclick="deposit()">
            Deposit
          </button>
          <button type="button" class="btn btn-danger" onclick="withdraw()">
            Withdraw
          </button>
          <button
            type="button"
            class="btn btn-warning"
            onclick="checkBalance()"
          >
            Check Balance
          </button>
          <button type="button" class="btn btn-info" onclick="showHistory()">
            Check history
          </button>
        </div>
        <!-- <div class="form-group">
                <button type="button" class="btn btn-info" onclick="showHistory()">Check history</button>
            </div> -->
        <div class="form-group">
          <h3 id="output"></h3>
        </div>
        <div class="form-group">
          <ul id="history" class="list-group"></ul>
        </div>
      </form>
    </div>
  </body>
</html>

<script>
  function createBnkAccount(initialBalance) {
    // let balance = initialBalance;
    // let history = [];

    let saveBalance = localStorage.getItem("balance");
    let saveHistory = localStorage.getItem("history");

    let balance = saveBalance ? Number(saveBalance) : initialBalance;

    let history = saveHistory ? JSON.parse(saveHistory) : [];

    function saveData() {
      localStorage.setItem("balance", balance);
      localStorage.setItem("history", JSON.stringify(history));
    }

    return {
      deposit(amount) {
        if (!account || account <= 0) {
          return "Enter valid Amount!!!";
        }
        balance += amount;
        history.push("+ ₹" + amount);

        saveData();

        return "Deposited: ₹" + amount;
      },
      withdraw(amount) {
        if (!amount || amount <= 0) {
          return "Enter valid amount";
        }
        if (amount > balance) {
          return "Insufficien Balance";
        }
        balance -= amount;
        history.push("- ₹ " + amount);

        saveData();

        return "Withdrawn:" + amount;
      },

      checkBalance() {
        return "Current Balance:" + balance;
      },
      getHistory() {
        return history;
      },
    };
  }

  const account = createBnkAccount(10000);

  /*UI function Update*/

  function getAmount() {
    return Number(document.getElementById("amount").value);
  }

  function showOutput(message) {
    document.getElementById("output").innerHTML = message;
  }

  function deposit() {
    const amount = getAmount();
    showOutput(account.deposit(amount));
  }

  function withdraw() {
    const amount = getAmount();
    showOutput(account.withdraw(amount));
  }

  function checkBalance() {
    const amount = getAmount();
    showOutput(account.checkBalance());
  }

  function showHistory() {
    const list = account.getHistory();
    const historyDiv = document.getElementById("history");

    if (list.length === 0) {
      historyDiv.innerHTML = "No Transection Yet!";
      return;
    }
    //historyDiv.innerHTML = list.map(item => "<li>" + item + "</li>").join("");

    function generateUTR() {
      const timestamp = Date.now(); ///current time
      const rendom = Math.floor(Math.random() * 10000000); ///rendom number
      return "UTR" + timestamp + rendom;
    }

    //console.log(generateUTR());
    ///
    historyDiv.innerHTML = list.map((item) => {
      const color = item.startsWith("+") ? "green" : "red";

      const nurretion = item.startsWith("+") ? "Credit" : "Devit";

      const utrNum = generateUTR();

      return (
        "<li style='color:" +
        color +
        "; font-weight:bold;'>" +
        item +
        "/" +
        utrNum +
        "/" +
        nurretion +
        "</li>"
      );
    });
  }
</script>
