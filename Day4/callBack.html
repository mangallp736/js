    <h1>Basic Promise</h1>
    <script>
        const promise = new Promise((resolve, reject) => {
            let success = true;
            if(success){
                resolve("Data is finding");
            }else {
                reject("Error:");
            }
        });
        /// Use Promise

        Promise
        .then((data) => {
            console.log(data);
        })
        .catch((Error) => {
            console.log(Error);
        });

    </script>
