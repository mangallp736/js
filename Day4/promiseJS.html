<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <h1>Promises JS</h1>
</body>
</html>

<script>
    const promise = new Promise((resolve, reject) => {        
        let success = true;

        if (success) {
            resolve("Data Found.");
        } else {
            reject("Data Not Found.");
        }
    });

    promise
     .then((data) => {
        console.log(data);        
     })
     .catch((error) => {
        console.log(error);        
     });

     ////(API Simulation)

     function getData() {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve("Data Found From Server");
            }, 2000);
        });
     }

     getData().then((data) => console.log(data));
     
     //Async / Await (Modern + Clean 🔥)

     ///Promise ka upgraded version

     ///Example

     async function fetchData() {
        let data = await getData();
        console.log(data)
     }

     fetchData();

// Error Handling (Important)

     async function fetchData() {
        try {
            let data = await getData();
            console.log(data);
        } catch (error) {
            console.log("Error: ", error);
            
        }
    }
</script>
